name: Backend connectivity contract

on:
  push:
    branches:
      - test/backend-connectivity-contract-final
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-connectivity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ESP32 to backend connectivity contract
        run: python3 test/backend-connectivity-contract.py
