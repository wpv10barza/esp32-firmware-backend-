name: Firmware and site artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonicalize-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Canonicalize visual labels only
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for dir in src site public; do
            if [[ -d "$dir" ]]; then
              if git grep -qiE 'asistente[[:space:]]+3c' -- "$dir"; then changed=1; fi
            fi
          done
          if [[ "$changed" -eq 0 ]]; then
            echo "No legacy visual label found."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"asistente\s+3c", re.IGNORECASE)
          for root_name in ("src", "site", "public"):
              root = Path(root_name)
              if not root.is_dir():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = pattern.sub("Interfaz Portátil", text)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
                      print(f"updated: {path}")
          PY

          for dir in src site public; do
            if [[ -d "$dir" ]]; then
              if git grep -qiE 'asistente[[:space:]]+3c' -- "$dir"; then
                echo "ERROR: legacy visual label remains in $dir"
                exit 1
              fi
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src site
          git restore --source=origin/main -- .github/workflows/firmware-and-pages.yml
          git rm -f .github/workflows/ui-label-migration.yml 2>/dev/null || true
          git add -- .github/workflows/firmware-and-pages.yml
          git commit -m "fix(ui): rename visual label to Interfaz Portátil"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}

  firmware:
    needs: canonicalize-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject local secrets
        run: |
          test ! -f include/local_config.h
          ! git ls-files | grep -Ei 'credentials|service-account|\.env$'
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Compile ESP32-S3-4848S040
        run: pio run --environment panel_4848s040
      - name: Package reproducible binaries
        run: |
          mkdir -p dist
          cp .pio/build/panel_4848s040/firmware.bin dist/
          cp .pio/build/panel_4848s040/bootloader.bin dist/
          cp .pio/build/panel_4848s040/partitions.bin dist/
          cp .pio/build/panel_4848s040/firmware.elf dist/
          printf '%s\n' '0x0000 bootloader.bin' '0x8000 partitions.bin' '0x10000 firmware.bin' > dist/flash-layout.txt
          (cd dist && sha256sum * > SHA256SUMS.txt)
          printf '{"source_sha":"%s","environment":"panel_4848s040","validation":"compiled_not_physically_flashed"}\n' "${GITHUB_SHA}" > dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-4848s040-firmware
          path: dist/
          if-no-files-found: error

  site:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site
        run: |
          test -s site/index.html
          grep -q 'ESP32-S3-4848S040' site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-site
          path: site/
          if-no-files-found: error
