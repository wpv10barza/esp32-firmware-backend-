name: Restore web confirmation flow

on:
  push:
    branches:
      - ui/web-confirmation-flow

permissions:
  contents: write

jobs:
  restore-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply architecture-safe firmware edits
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main.cpp
          test -f include/app_config.h
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/main.cpp")
          text = path.read_text(encoding="utf-8")
          forbidden = ["preparedCommand", "prepare3CCommand", "cancelPreparedCommand"]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"Forbidden touchscreen-confirmation artifact found: {token}")
          replacements = {
              'case PanelState::Pending: return "ESPERA CONFIRMACION";': 'case PanelState::Pending: return "PENDIENTE";',
              'case PanelState::Applied: return "CAMBIO APLICADO";': 'case PanelState::Applied: return "APLICADO";',
              'case PanelState::Rejected: return "ORDEN CANCELADA";': 'case PanelState::Rejected: return "RECHAZADO";',
              'updatePanel(PanelState::Pending, "Confirme en Interfaz Portátil", true);': 'updatePanel(PanelState::Pending, "CONFIRMACIÓN REQUERIDA EN WEB", true);',
              'updatePanel(PanelState::Pending, "Confirme en Interfaz Portátil");': 'updatePanel(PanelState::Pending, "CONFIRMACIÓN REQUERIDA EN WEB");',
              'La orden crea una vista previa. Google Sheets solo cambia despues de confirmar en Interfaz Portátil.': 'La orden se envía al backend y queda pendiente de confirmación en la web. Google Sheets cambia solo después de la confirmación web.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected string not found: {old}")
              text = text.replace(old, new)
          old_block = '''  } else if (status == "rejected") {\n    updatePanel(PanelState::Rejected, result.length() ? result : "Cancelado en WSL", true);\n    lastCommandId = "";\n  } else if (status == "pending_confirmation" && panelState != PanelState::Pending) {\n    updatePanel(PanelState::Pending, "CONFIRMACIÓN REQUERIDA EN WEB");\n  }'''
          new_block = '''  } else if (status == "rejected") {\n    updatePanel(PanelState::Rejected, result.length() ? result : "Rechazado en WSL", true);\n    lastCommandId = "";\n  } else if (status == "error" || status == "failed" || status == "fallido") {\n    updatePanel(PanelState::Error, result.length() ? result : "Error reportado por WSL", true);\n    lastCommandId = "";\n  } else if (status == "pending_confirmation" || status == "pending" || status == "pendiente") {\n    updatePanel(PanelState::Pending, "CONFIRMACIÓN REQUERIDA EN WEB");\n  }'''
          if old_block not in text:
              raise SystemExit("Expected polling block not found")
          text = text.replace(old_block, new_block)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify architecture contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'commandPollMs = 2500UL' include/app_config.h
          grep -q 'http.begin(endpoint("/api/device/v1/commands"));' src/main.cpp
          grep -q 'const int code = http.POST(body);' src/main.cpp
          grep -q 'send3CCommand(app_config::defaultCommand);' src/main.cpp
          grep -q 'PENDIENTE' src/main.cpp
          grep -q 'CONFIRMACIÓN REQUERIDA EN WEB' src/main.cpp
          grep -q 'status == "error"' src/main.cpp
          ! grep -q 'preparedCommand' src/main.cpp
          ! grep -q 'prepare3CCommand' src/main.cpp
          ! grep -q 'cancelPreparedCommand' src/main.cpp
          ! grep -q 'CONFIRMAR' src/main.cpp
          ! grep -q 'CANCELAR' src/main.cpp
          git diff --check

      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Build ESP32-S3-4848S040
        run: pio run --environment panel_4848s040

      - name: Commit firmware correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=origin/main -- .github/workflows/firmware-and-pages.yml
          git rm -f .github/workflows/restore-web-confirmation-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/main.cpp .github/workflows/firmware-and-pages.yml
          git diff --cached --check
          git diff --cached -- src/main.cpp .github/workflows/firmware-and-pages.yml
          git commit -m "fix: restore web confirmation state flow"
          git push origin HEAD:${GITHUB_REF_NAME}
